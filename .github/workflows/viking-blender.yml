name: Viking Blender studio

on:
  push:
    branches: [codex/viking-blender-enhancement]
    paths:
      - .github/workflows/viking-blender.yml
      - tools/viking_blender.py
      - assets/viking/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Inspect and render Viking
        env:
          OMP_NUM_THREADS: '4'
        run: blender --background --factory-startup --threads 4 --python-exit-code 1 --python tools/viking_blender.py
      - name: Upload renders and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viking-renders
          path: |
            output/viking/*.png
            output/viking/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Upload hero GLB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viking-hero-glb
          path: output/viking/Viking_Hero.glb
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Upload optimized GLB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viking-optimized-glb
          path: output/viking/Viking_Optimized.glb
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Upload editable Blender scene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viking-blend-scene
          path: output/viking/Viking_Studio.blend
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
