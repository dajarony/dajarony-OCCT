name: Viking restrained idle
on:
  push:
    branches: [codex/viking-blender-enhancement]
    paths:
      - .github/workflows/viking-idle.yml
      - tools/viking_idle.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  animate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Build five-second idle
        run: blender --background --factory-startup --threads 4 --python-exit-code 1 --python tools/viking_idle.py
      - name: Upload animated GLB
        uses: actions/upload-artifact@v4
        with:
          name: viking-idle-glb
          path: output/viking-idle/Viking_Idle.glb
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: viking-idle-report
          path: output/viking-idle/report.json
          if-no-files-found: error
          retention-days: 14
