name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate Blender HD mascot
        run: |
          blender -b --python-exit-code 1 --python tools/build_avocado_blender.py
          test -s public/avocado-blender.glb
          ls -lh public/avocado-blender.glb
      - run: npm install
      - run: npm run build
      - name: Verify production files
        run: |
          test -s dist/index.html
          test -s dist/circuito.html
          test -s dist/compressor.html
          test -s dist/avocado-blender.glb
          echo "Pages artifact contains compressor.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Pages site
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dajarony.github.io/dajarony-OCCT"
          for path in "/" "/compressor.html"; do
            url="${BASE}${path}?build=${GITHUB_SHA}"
            echo "Checking ${url}"
            curl -fLsS \
              -H 'Cache-Control: no-cache' \
              --retry 18 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" >/dev/null
          done
          echo "GitHub Pages root and compressor.html are live."
